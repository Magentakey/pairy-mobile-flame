name: pairy
description: "Pairy - 2D Platform Puzzle Mobile Game built with Flutter + Flame."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flame: ^1.18.0
  flame_tiled: any
  flame_audio: ^2.0.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:

  uses-material-design: true

  assets:
    - assets/images/player/
    - assets/images/player/walk/
    - assets/images/player/jump/
    - assets/images/fairy/
    - assets/images/ui/
    - assets/images/environment/
    - assets/images/exit_gate/
    - assets/tiles/
    - assets/maps/
    - assets/audio/sfx/
    - assets/audio/bgm/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  # Adaptive icon Android (opsional tapi disarankan). Gambar full sudah dipakai
  # sebagai foreground; kalau nanti punya versi tanpa background/rounded corner,
  # ganti adaptive_icon_foreground ke file itu untuk hasil lebih rapi.
  adaptive_icon_background: "#0B1633"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter_native_splash:
  color: "#0B1633"
  image: assets/icon/icon.png
  android_12:
    color: "#0B1633"
    image: assets/icon/icon.png
  android: true
  ios: false
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package